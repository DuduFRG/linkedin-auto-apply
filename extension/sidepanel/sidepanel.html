<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApplyPilot</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- Static text is translated at runtime from shared/i18n.js through data-i18n* attributes. -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="6" fill="currentColor" />
          <path d="M9 21.5 16 9l7 12.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M12 17.5h8" stroke="#fff" stroke-width="2.6" stroke-linecap="round" />
        </svg>
        <div>
          <h1>ApplyPilot</h1>
          <p data-i18n="tagline"></p>
        </div>
      </div>
      <div class="header-actions">
        <label class="lang-select">
          <span class="sr-only" data-i18n="language"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>
          <select id="languageSelect" data-setting="language">
            <option value="auto" data-i18n="languageAuto"></option>
            <option value="pt">Português</option>
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </label>
        <button id="btnFocusTab" class="icon-btn" type="button" data-i18n-title="goToTab" data-i18n-aria="goToTab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg>
        </button>
      </div>
    </header>

    <!-- First-run acceptance of the terms of use. Shown until accepted. -->
    <section id="termsCard" class="card terms" hidden aria-labelledby="termsTitle">
      <div class="terms-head">
        <h2 id="termsTitle" data-i18n="termsTitle"></h2>
        <p data-i18n="termsIntro"></p>
      </div>
      <div class="terms-body">
        <ul class="terms-list">
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg><span data-i18n="termsPoint1"></span></li>
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg><span data-i18n="termsPoint2"></span></li>
          <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg><span data-i18n="termsPoint3"></span></li>
        </ul>
        <div class="terms-links">
          <a href="https://dudufrg.github.io/linkedin-auto-apply/termos/" target="_blank" rel="noopener noreferrer" data-i18n="termsLink"></a>
          <a href="https://dudufrg.github.io/linkedin-auto-apply/privacidade/" target="_blank" rel="noopener noreferrer" data-i18n="privacyLink"></a>
        </div>
        <label class="check"><input type="checkbox" id="termsCheck" /><span data-i18n="termsCheckbox"></span></label>
        <button id="btnAcceptTerms" class="btn btn-primary" type="button" disabled data-i18n="termsAccept"></button>
      </div>
    </section>

    <!-- Question / confirmation card. Rendered by sidepanel.js -->
    <section id="pendingCard" class="card pending" hidden aria-live="polite"></section>

    <section class="card status-card">
      <div class="status-top">
        <span id="statusPill" class="pill" data-tone="neutral"><span class="dot"></span><span id="statusLabel"></span></span>
        <span id="statusTimer" class="status-timer"></span>
      </div>
      <p id="statusMessage" class="status-message"></p>

      <div id="currentJob" class="current-job" hidden>
        <span class="eyebrow" data-i18n="currentJob"></span>
        <a id="currentJobTitle" class="current-job-title" target="_blank" rel="noopener noreferrer"></a>
        <span id="currentJobCompany" class="current-job-company"></span>
      </div>

      <dl class="stats">
        <div class="stat"><dt data-i18n="statApplied"></dt><dd id="statApplied">0</dd></div>
        <div class="stat"><dt data-i18n="statSkipped"></dt><dd id="statSkipped">0</dd></div>
        <div class="stat"><dt data-i18n="statFailed"></dt><dd id="statFailed">0</dd></div>
      </dl>

      <div class="progress" role="progressbar" data-i18n-aria="goalAria" aria-valuemin="0" id="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="progress-meta" id="progressText"></p>

      <div class="controls">
        <button id="btnPrimary" class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" id="btnPrimaryIcon"><path d="M8 5v14l11-7z" /></svg>
          <span id="btnPrimaryLabel"></span>
        </button>
        <button id="btnStop" class="btn btn-secondary" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
          <span data-i18n="stop"></span>
        </button>
      </div>
    </section>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" type="button" data-tab="run" aria-selected="true"><span data-i18n="tabSearch"></span></button>
      <button class="tab" role="tab" type="button" data-tab="answers" aria-selected="false"><span data-i18n="tabAnswers"></span> <span class="tab-count" id="answersCount">0</span></button>
      <button class="tab" role="tab" type="button" data-tab="profile" aria-selected="false"><span data-i18n="tabProfile"></span></button>
      <button class="tab" role="tab" type="button" data-tab="history" aria-selected="false"><span data-i18n="tabHistory"></span></button>
    </nav>

    <main>
      <!-- ============ Search ============ -->
      <section class="tab-panel" id="tab-run" role="tabpanel">
        <form class="card form" id="settingsForm" autocomplete="off">
          <div class="card-head">
            <h2 data-i18n="searchSettings"></h2>
            <span class="hint" id="searchLockHint" data-i18n="searchLocked" hidden></span>
          </div>

          <label class="field">
            <span class="field-label"><span data-i18n="keyword"></span> <em>*</em></span>
            <input type="text" data-setting="keyword" data-search data-i18n-ph="keywordPh" maxlength="120" />
          </label>

          <label class="field">
            <span class="field-label" data-i18n="location"></span>
            <input type="text" data-setting="location" data-search data-i18n-ph="locationPh" maxlength="120" />
          </label>

          <div class="row">
            <label class="field">
              <span class="field-label" data-i18n="datePosted"></span>
              <select data-setting="datePosted" data-search>
                <option value="any" data-i18n="dateAny"></option>
                <option value="month" data-i18n="dateMonth"></option>
                <option value="week" data-i18n="dateWeek"></option>
                <option value="day" data-i18n="dateDay"></option>
              </select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n="goal"></span>
              <input type="number" data-setting="maxApplications" min="1" max="200" step="1" />
            </label>
          </div>

          <label class="field">
            <span class="field-label" data-i18n="resumeField"></span>
            <input type="text" data-setting="resumeName" data-i18n-ph="resumePh" maxlength="160" />
            <span class="field-help" data-i18n="resumeHelp"></span>
          </label>

          <details class="advanced">
            <summary data-i18n="advanced"></summary>
            <div class="row">
              <label class="field">
                <span class="field-label" data-i18n="minDelay"></span>
                <input type="number" data-setting="minDelaySec" min="5" max="600" step="1" />
              </label>
              <label class="field">
                <span class="field-label" data-i18n="maxDelay"></span>
                <input type="number" data-setting="maxDelaySec" min="5" max="900" step="1" />
              </label>
            </div>
            <label class="field">
              <span class="field-label" data-i18n="exclude"></span>
              <input type="text" data-setting="excludeKeywords" data-i18n-ph="excludePh" maxlength="400" />
              <span class="field-help" data-i18n="excludeHelp"></span>
            </label>
            <label class="switch"><input type="checkbox" data-setting="remoteOnly" data-search /><span class="switch-ui"></span><span data-i18n="remoteOnly"></span></label>
            <label class="switch"><input type="checkbox" data-setting="confirmBeforeSubmit" /><span class="switch-ui"></span><span data-i18n="confirmBefore"></span></label>
            <label class="switch"><input type="checkbox" data-setting="askOptionalFields" /><span class="switch-ui"></span><span data-i18n="askOptional"></span></label>
            <label class="switch"><input type="checkbox" data-setting="followCompanies" /><span class="switch-ui"></span><span data-i18n="follow"></span></label>
          </details>
        </form>

        <section class="card">
          <div class="card-head">
            <h2 data-i18n="activity"></h2>
            <button class="link-btn" type="button" id="btnClearLog" data-i18n="clear"></button>
          </div>
          <ol class="log" id="logList"></ol>
          <p class="empty" id="logEmpty" data-i18n="noActivity"></p>
        </section>
      </section>

      <!-- ============ Answers ============ -->
      <section class="tab-panel" id="tab-answers" role="tabpanel" hidden>
        <section class="card">
          <div class="card-head">
            <h2 data-i18n="answerBank"></h2>
            <div class="head-actions">
              <button class="link-btn" type="button" id="btnExport" data-i18n="export"></button>
              <button class="link-btn" type="button" id="btnImport" data-i18n="import"></button>
              <input type="file" id="importFile" accept="application/json,.json" hidden />
            </div>
          </div>
          <p class="card-sub" data-i18n="answersSub"></p>
          <details class="add-answer" id="addAnswer">
            <summary data-i18n="manualTitle"></summary>
            <form class="form" id="addAnswerForm" autocomplete="off">
              <label class="field">
                <span class="field-label" data-i18n="manualQuestion"></span>
                <input type="text" id="manualQuestion" data-i18n-ph="manualQuestionPh" maxlength="300" />
              </label>
              <label class="field">
                <span class="field-label" data-i18n="manualAnswer"></span>
                <input type="text" id="manualAnswer" data-i18n-ph="manualAnswerPh" maxlength="1000" />
              </label>
              <button class="btn btn-primary" type="submit" data-i18n="manualAdd"></button>
            </form>
            <div class="form bulk">
              <label class="field">
                <span class="field-label" data-i18n="bulkLabel"></span>
                <textarea id="bulkAnswers" rows="5" data-i18n-ph="bulkPh"></textarea>
                <span class="field-help" data-i18n="bulkHint"></span>
              </label>
              <button class="btn btn-secondary" type="button" id="btnBulkAdd" data-i18n="bulkAdd"></button>
            </div>
          </details>
          <input type="search" class="search" id="answersSearch" data-i18n-ph="answersSearch" data-i18n-aria="answersSearch" />
          <ul class="answers" id="answersList"></ul>
          <p class="empty" id="answersEmpty"></p>
          <div class="danger-zone">
            <button class="link-btn danger" type="button" id="btnClearAnswers" data-i18n="clearAnswers"></button>
          </div>
        </section>
      </section>

      <!-- ============ Profile ============ -->
      <section class="tab-panel" id="tab-profile" role="tabpanel" hidden>
        <form class="card form" id="profileForm" autocomplete="off">
          <div class="card-head"><h2 data-i18n="yourData"></h2></div>
          <p class="card-sub" data-i18n="profileSub"></p>
          <div class="row">
            <label class="field"><span class="field-label" data-i18n="firstName"></span><input type="text" data-profile="firstName" maxlength="80" /></label>
            <label class="field"><span class="field-label" data-i18n="lastName"></span><input type="text" data-profile="lastName" maxlength="80" /></label>
          </div>
          <label class="field"><span class="field-label" data-i18n="email"></span><input type="email" data-profile="email" maxlength="160" /></label>
          <div class="row">
            <label class="field"><span class="field-label" data-i18n="phoneCountry"></span><input type="text" data-profile="phoneCountry" data-i18n-ph="phoneCountryPh" maxlength="40" /></label>
            <label class="field"><span class="field-label" data-i18n="phone"></span><input type="tel" data-profile="phone" maxlength="30" /></label>
          </div>
          <label class="field"><span class="field-label" data-i18n="city"></span><input type="text" data-profile="city" data-i18n-ph="cityPh" maxlength="120" /></label>
          <label class="field"><span class="field-label" data-i18n="linkedinUrl"></span><input type="url" data-profile="linkedinUrl" maxlength="200" /></label>
          <label class="field"><span class="field-label" data-i18n="website"></span><input type="url" data-profile="website" maxlength="200" /></label>
        </form>

        <section class="card privacy">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 9.5 4-1.2 7-5 7-9.5V6z" /><path d="m9 12 2 2 4-4" /></svg>
          <div>
            <h3 data-i18n="privacy"></h3>
            <p data-i18n="privacyBody"></p>
          </div>
        </section>
      </section>

      <!-- ============ History ============ -->
      <section class="tab-panel" id="tab-history" role="tabpanel" hidden>
        <section class="card">
          <div class="card-head">
            <h2 data-i18n="history"></h2>
            <button class="link-btn danger" type="button" id="btnClearHistory" data-i18n="clear"></button>
          </div>
          <div class="segmented" id="historyFilter" role="group" data-i18n-aria="filterHistory">
            <button type="button" data-filter="all" aria-pressed="true" data-i18n="filterAll"></button>
            <button type="button" data-filter="applied" aria-pressed="false" data-i18n="filterApplied"></button>
            <button type="button" data-filter="skipped" aria-pressed="false" data-i18n="filterSkipped"></button>
            <button type="button" data-filter="failed" aria-pressed="false" data-i18n="filterFailed"></button>
          </div>
          <ul class="history" id="historyList"></ul>
          <p class="empty" id="historyEmpty" data-i18n="historyEmpty"></p>
        </section>
      </section>
    </main>

    <footer class="panel-footer">
      <span id="footerCredit"></span>
      <nav aria-label="Legal">
        <a href="https://dudufrg.github.io/linkedin-auto-apply/termos/" target="_blank" rel="noopener noreferrer" data-i18n="termsShort"></a>
        <a href="https://dudufrg.github.io/linkedin-auto-apply/privacidade/" target="_blank" rel="noopener noreferrer" data-i18n="privacyShort"></a>
        <a href="https://www.instagram.com/dudu_frg/" target="_blank" rel="noopener noreferrer">@dudu_frg</a>
      </nav>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../shared/constants.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/text.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
