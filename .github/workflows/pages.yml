name: Deploy landing page

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must publish from GitHub Actions (not from a branch, which renders the README).
      # Switch the source when needed; if the token is not allowed to, the deploy step
      # below fails with a clear message and the setting is changed once by hand:
      # Settings > Pages > Source: GitHub Actions.
      - name: Use GitHub Actions as the Pages source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo none)
          echo "Current Pages source: $current"
          if [ "$current" = "none" ]; then
            gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow
          elif [ "$current" != "workflow" ]; then
            gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
